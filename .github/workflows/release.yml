name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Sign APK (debug key for sideloading)
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out android/app/build/outputs/apk/release/track-detect-${{ steps.tag.outputs.name }}.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Track Detect ${{ steps.tag.outputs.name }}
          body: |
            ## Track Detect ${{ steps.tag.outputs.name }}

            Multi-source tracker detection tool for Android.

            **Detects:**
            - BLE trackers: AirTag, Tile, Samsung SmartTag, Chipolo, Pebblebee, and unknowns
            - GPS/LTE tracker hotspots (OBD port devices, hidden boxes)
            - RF periodic transmitters via SDR (laptop companion tool)
            - IMSI catcher anomalies (cellular scanner)

            **Install:**
            1. Download `track-detect-${{ steps.tag.outputs.name }}.apk` below
            2. On your phone: Settings → Apps → Special app access → Install unknown apps → allow your file manager
            3. Tap the APK to install — approve the Play Protect warning
            4. Grant Bluetooth, Location (precise), and Notifications permissions on first launch

            **Requirements:** Android 12+ (API 31)
          files: android/app/build/outputs/apk/release/track-detect-${{ steps.tag.outputs.name }}.apk
          draft: false
          prerelease: false
