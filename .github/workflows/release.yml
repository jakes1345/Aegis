name: Release

# Three ways to cut a release, all producing the same signed APK and GitHub
# Release:
#   - push a tag            v2.2.0
#   - push a branch         release/v2.2.0   (the tag is created at its head)
#   - Actions → Run workflow with the tag as input
# The branch form exists for environments that can push branches but not tags.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            NAME="$INPUT_TAG"
          elif [ "$REF_TYPE" = "branch" ]; then
            NAME="${REF_NAME#release/}"
          else
            NAME="$REF_NAME"
          fi
          case "$NAME" in
            v[0-9]*) ;;
            *) echo "::error::'$NAME' is not a release tag (expected vX.Y.Z)"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME from $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK and an NDK (ANDROID_NDK_LATEST_HOME).
      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comms-crypto

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      # ANDROID_NDK_LATEST_HOME is a runner environment variable, not a workflow
      # `env.` value, so it is read in the shell rather than in an expression.
      - name: Build release APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          gradle assembleRelease --no-daemon --stacktrace

      # Android refuses to install an update whose signing certificate differs from
      # the one already on the device. This step used to run `keytool -genkey` on
      # every release, which mints a brand new keypair each time — so every release
      # was signed by a different certificate and could only be installed by
      # uninstalling the previous build first, taking the cell baseline, the event
      # log and the trusted-device list with it.
      #
      # With the ANDROID_KEYSTORE_BASE64 secret set, every release is signed by the
      # same key and installs straight over the last one. Without it we fall back to
      # the old throwaway key so the build still produces something installable, and
      # the release notes say plainly that it needs a clean install.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the persistent release key."
          else
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and cannot be installed over an earlier release."
          fi

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          OUT="android/app/build/outputs/apk/release/aegis-${TAG}.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/signing/release.keystore" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          # The certificate digest is what decides whether a phone will accept this
          # as an update to the installed build, so print it: two releases that
          # share this value will install over each other, and two that do not
          # never will, whatever their version numbers say.
          "$APKSIGNER" verify --print-certs "$OUT"

      - name: Compose release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
          STABLE: ${{ steps.signing.outputs.stable }}
        run: |
          {
            echo "## Aegis ${TAG}"
            echo
            echo "Aegis — defensive security monitor for Android. Detects BLE tracker tags,"
            echo "Wi-Fi bait networks, IMSI-catcher anomalies, and sweeps NFC/RFID cards."
            echo "Stores captured cards in an on-device AES-256 vault and can replay them"
            echo "via Host Card Emulation. Detection data stays on the phone; the Map tab"
            echo "downloads OpenStreetMap tiles, which exposes your IP and the area viewed."
            echo
            echo "**COMMS: end-to-end encrypted messaging and calls between Aegis apps.**"
            echo "Messages use the Olm double ratchet (vodozemac) and are sealed so your"
            echo "relay sees neither content nor sender; calls are WebRTC audio keyed inside"
            echo "that same encrypted session. Contacts are pinned by key and verified by QR"
            echo "code or safety number. No Google services and no phone carrier are involved."
            echo "An **Aegis number is not a phone number**: it is a random nine-digit ID your"
            echo "relay hands out, and it only reaches other Aegis apps on the same relay."
            echo "Push wake-ups use UnifiedPush (install ntfy or another distributor);"
            echo "keeping COMMS \"Online\" makes incoming calls ring reliably."
            echo
            echo "To use COMMS you (or someone you trust) deploy the relay in \`comms-worker/\`"
            echo "to Cloudflare once; the README there has the three commands. Everyone else joins"
            echo "by invite: COMMS → INVITE makes a one-time QR code or link, so nobody else needs"
            echo "the relay URL or its enrollment secret. Camera is asked"
            echo "for when scanning a contact's code; Microphone as soon as you have a number, so"
            echo "a call can be answered straight from the lock screen. On Android 14+, allow"
            echo "full-screen calls when COMMS settings asks, and set Aegis's battery use to"
            echo "Unrestricted so the background connection survives the screen being off."
            echo
            echo "**Install**"
            echo
            if [ "$STABLE" = "true" ]; then
              echo "1. Download \`aegis-${TAG}.apk\` below and tap it."
              echo "2. It installs straight over an earlier Aegis release and keeps your baseline, event log and trusted devices."
              echo "3. First install only: Settings → Apps → Special app access → Install unknown apps → allow your file manager."
              echo "4. Grant Nearby devices and Location (precise). Notifications is optional — declining it costs the alert, not the detector."
            else
              echo "> [!WARNING]"
              echo "> This build is signed with a throwaway key, so Android will refuse to install it"
              echo "> over an earlier release. You have to uninstall the old version first, which"
              echo "> clears the cell baseline, the event log and the trusted-device list."
              echo
              echo "1. Uninstall any existing Aegis."
              echo "2. Download \`aegis-${TAG}.apk\` below and tap it."
              echo "3. Settings → Apps → Special app access → Install unknown apps → allow your file manager."
              echo "4. Grant Nearby devices and Location (precise). Notifications is optional — declining it costs the alert, not the detector."
            fi
            echo
            echo "**Requirements:** Android 12+ (API 31)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Aegis ${{ steps.tag.outputs.name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/aegis-${{ steps.tag.outputs.name }}.apk
          draft: false
          prerelease: false
