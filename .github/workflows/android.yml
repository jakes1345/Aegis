name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships Android SDK (API 35, build-tools 35.x) and an NDK, and
      # sets ANDROID_HOME and ANDROID_NDK_LATEST_HOME, so no separate setup action
      # is needed.

      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: comms-crypto

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # No wrapper jar is committed, so Gradle is installed by the action and
      # put on PATH. Keeps a binary out of the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      # ANDROID_NDK_LATEST_HOME is a runner environment variable, not a workflow
      # `env.` value, so it is read in the shell rather than in an expression.
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
