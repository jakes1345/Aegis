# Aegis comms relay: store-and-forward for end-to-end encrypted envelopes
# between Aegis apps, addressed by Aegis number (not a phone number).
#
# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ENROLL_SECRET        One-time code typed into Aegis when it registers
#   TURN_KEY_ID          Optional, for calls: Cloudflare Realtime TURN key id
#   TURN_KEY_API_TOKEN   Optional, for calls: its API token
#   ADMIN_SECRET         Optional, for AegisCoin: lets the operator mint coins (POST /v1/admin/coin/mint)
#
# Plain variables (may go in [vars] below):
#   COIN_INITIAL_BALANCE AegisCoin every new registration starts with, e.g. "100"; unset: none

name = "aegis-comms"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]
