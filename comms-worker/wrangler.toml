# Aegis comms relay.
#
# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   TWILIO_ACCOUNT_SID            Twilio account SID (AC…)
#   TWILIO_AUTH_TOKEN             Twilio auth token; also validates webhook signatures
#   TWILIO_NUMBER                 The purchased number in E.164, e.g. +15551234567
#   FIREBASE_SERVICE_ACCOUNT_JSON The Firebase service-account key file, verbatim
#   ENROLL_SECRET                 One-time code typed into Aegis to pair a phone
#   TWILIO_API_KEY_SID            Voice: API key (SK…) that signs access tokens
#   TWILIO_API_KEY_SECRET         Voice: its secret
#   TWILIO_TWIML_APP_SID          Voice: TwiML App (AP…) whose voice URL is /twilio/voice
#   TWILIO_PUSH_CREDENTIAL_SID    Voice: FCM push credential (CR…) Twilio rings the app through
#
# `wrangler deploy` prints the Worker URL; scripts/setup-twilio.mjs points the
# number's webhooks at it and creates the voice resources, printing the four
# voice secrets to set.

name = "aegis-comms"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "aegis-comms"
# Created 2026-09-23 in ENAM; the schema was applied through the Cloudflare connector.
database_id = "173beae5-4d90-4e45-b76a-f5f67d08bb13"
migrations_dir = "migrations"

[vars]
# How many messages one sync call returns at most.
SYNC_PAGE_SIZE = "200"
